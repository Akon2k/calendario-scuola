# Calendario EduFácil — servicio web + túnel
#
#   Sólo la página:        docker compose up -d
#   Con túnel a internet:  docker compose --profile tunel up -d
#   Ver la URL del túnel:  docker compose logs -f tunel
#   Detener todo:          docker compose --profile tunel down
#
# El pipeline (main.py) NO corre aquí: sigue en Windows con la tarea
# programada. El contenedor sólo sirve lo que haya en salida/.
# El .ics se genera en el navegador (Blob), no necesita endpoints.

services:
  web:
    image: nginx:1.27-alpine
    container_name: calendario-web
    ports:
      - "8080:80"
    volumes:
      - ./salida:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Túnel de Cloudflare (quick tunnel, sin cuenta ni dominio).
  # La URL es efímera: cambia si reinicias el túnel.
  # Para URL fija: crear un tunnel con cuenta Cloudflare y dominio propio,
  # y reemplazar el comando por: tunnel run <nombre-del-tunnel>
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: calendario-tunel
    command: tunnel --url http://web:80 --no-autoupdate
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["tunel"]
