# Servidor estático para el calendario comunitario
# Sirve salida/calendario_evaluaciones.html como página de inicio.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index calendario_evaluaciones.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/xml;

    # La página de inicio se sirve en "/" también
    location = / {
        try_files /calendario_evaluaciones.html =404;
    }

    location / {
        try_files $uri =404;
    }

    # Un favicon que no ensucie los logs
    location = /favicon.ico {
        return 204;
        access_log off;
    }

    # El manifest de la PWA necesita MIME JSON: con octet-stream Chrome lo ignora
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }
}
